[project]
name = "pydantic-ai-jupyter"
version = "0.1.0"
description = "Experiment with Pydantic AI Agents in your notebooks."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
    { name = "Kyle Kelley", email = "rgbkrk@gmail.com" }
]
keywords = ["pydantic-ai", "jupyter", "notebook", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Pydantic",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic-ai>=0.1.0",
    "ipython>=7.0.0",
    "partial-json-parser>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "mypy >= 1.19.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.0.0",
    "pytest>=9.0.0",
    "pytest-mock>=3.14.0",
    "inline-snapshot>=0.19.3",
    "dirty-equals>=0.9.0",
    "anyio>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/rgbkrk/pydantic-ai-jupyter"
Repository = "https://github.com/rgbkrk/pydantic-ai-jupyter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_jupyter"]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "dirty-equals>=0.11",
    "inline-snapshot>=0.31.1",
    "ipykernel>=6.0.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.14",
]

[tool.inline-snapshot]
format-command = "ruff format"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Allow long lines in tests for HTML snapshots
"pydantic_ai_jupyter/views.py" = ["E501"]  # Allow long lines for HTML templates in render methods
"notebooks/*" = ["E402", "E501", "F811"]  # Notebooks: allow non-top imports, long lines, and redefinitions
